name: Skinport, catalog and images

on:
  schedule:
    - cron: "41 5 * * *"   # daily, 02:41 in São Paulo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh catalog from CSFloat schema
        run: python -m collector.catalog
      - name: Collect Skinport sales stats
        run: python -m collector.skinport
      - name: Refresh skin images and rarity
        run: python -m collector.images
      - name: Build page
        run: python -m collector.build
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "data: skinport stats $(date -u +%F)"
          git pull --rebase --quiet
          git push
