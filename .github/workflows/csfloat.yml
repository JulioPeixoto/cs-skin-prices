name: CSFloat history

on:
  schedule:
    - cron: "11 * * * *"   # hourly; each run fetches up to 180 items
  workflow_dispatch:
    inputs:
      max:
        description: "Items to fetch in this run"
        default: "180"

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch a batch of CSFloat histories
        run: python -m collector.csfloat --max "${{ github.event.inputs.max || '180' }}"
      - name: Build page
        run: python -m collector.build
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/index.html
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "data: csfloat batch $(date -u +%FT%H:%MZ)"
          git pull --rebase --quiet
          git push
